[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semper-secure-messaging"
version = "0.1.0.dev0"
description = "Application-neutral secure messaging and artifact-reference substrate"
requires-python = ">=3.11"
dependencies = []
license = {text = "Apache-2.0"}

[project.optional-dependencies]
matrix = ["matrix-nio[e2e]>=0.26,<0.27"]

[project.scripts]
secure-messaging = "secure_messaging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
